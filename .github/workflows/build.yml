name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle configuration
        run: ./gradlew help --no-daemon --warning-mode all

      - name: Compile the mod
        run: ./gradlew compileJava --no-daemon --warning-mode all

      - name: Run automated tests
        run: ./gradlew test --no-daemon --warning-mode all

      - name: Build the mod JAR
        run: ./gradlew build --no-daemon --warning-mode all

      - name: Verify the artifact exists and is non-empty
        run: |
          ls -la build/libs/
          test -s build/libs/laglens-*.jar
          echo "JAR verification passed."

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: laglens-jar
          path: build/libs/*.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laglens-test-reports
          path: |
            build/reports/tests/
            build/test-results/
